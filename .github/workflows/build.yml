name: Build Windows Executable (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Package Windows Executable (Installer & Portable)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies Reproducibly
        shell: pwsh
        run: |
          npm ci --include=optional

      - name: Compile Web Application
        run: npm run build

      - name: Package Windows Binary with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      - name: Create Installer Standalone ZIP Archive
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path release/*Setup*.exe | Select-Object -First 1
          if ($setupExe) {
            $zipPath = "release/Blacksite-Mod-Manager-Setup-2.1.0.zip"
            Write-Host "Creating zip archive containing setup executable: $($setupExe.Name) -> $zipPath"
            Compress-Archive -Path $setupExe.FullName -DestinationPath $zipPath -Force
            if (Test-Path $zipPath) {
              $size = (Get-Item $zipPath).Length
              Write-Host "Successfully created $zipPath ($size bytes)"
            }
          }

      - name: Upload Windows Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blacksite-windows-binaries
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap

      - name: Refresh Release Tag for Latest Source Code Archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh release delete v2.1.0-latest --yes --cleanup-tag 2>$null
          git tag -f v2.1.0-latest ${{ github.sha }}
          git push origin -f refs/tags/v2.1.0-latest

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v2.1.0-latest
          target_commitish: ${{ github.sha }}
          name: "Blacksite Mod Manager v2.1.0 - Windows Desktop (.exe & .zip)"
          body: |
            ### 🛡️ Blacksite Mod Manager Windows Standalone Release

            Automated build compiled via GitHub Actions for **Windows x64**.

            ---

            #### 📦 Available Downloads:
            - **Setup Installer (`Blacksite-Mod-Manager-Setup-2.1.0.exe`)**
              *Standard Windows installer with Start Menu shortcuts and uninstaller support.*
            - **Setup Installer ZIP (`Blacksite-Mod-Manager-Setup-2.1.0.zip`)**
              *Standalone ZIP archive containing solely Blacksite-Mod-Manager-Setup-2.1.0.exe.*
            - **Portable Executable (`Blacksite-Mod-Manager-Portable-2.1.0.exe`)**
              *Zero-install standalone binary. Run directly from any folder or USB drive.*

            ---

            #### ⚡ Key Desktop Features:
            - **Direct Filesystem Access**: Modifies SPT directories without browser download prompts or sandbox limitations.
            - **Native Server Launcher**: Monitors local SPT server console output and auto-boots game launcher when ready.
            - **Live Forge Sync**: Direct integration with the sp-mod.com modding repository.
            - **Safe Mod Updates**: Automatically preserves mod configuration files when updating.
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.zip
