name: .NET Core Desktop

on:
  push:
    branches:
      - main
      - feature/v1.9.0-optimization
      - arena/01a0ee8e-blacksite-mod-manager-test
  pull_request:
    branches:
      - main
      - feature/v1.9.0-optimization

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build WPF application
        run: dotnet build Blacksite/Blacksite.csproj --configuration Release
